<!doctype html>

  <head>

    <meta name="theme-color" content="#f5f5eb" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>VIBE — Découvre les events à Abidjan</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/splash-photo-2.jpg" as="image" />
    <link rel="preload" href="/splash-logo.png" as="image" />

    
    <meta property="og:title" content="VIBE — Découvre les events à Abidjan" />
    <meta property="og:description" content="Concerts, festivals, expos, brunch... Trouve ce qui se passe autour de toi ce soir à Abidjan." />

    <meta property="og:image" content="%SITE_ORIGIN%/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VIBE — Découvre les events à Abidjan" />

  <body>
    <!-- Instant splash: shows before React loads -->
    <div id="instant-splash" style="position:fixed;inset:0;z-index:9999;background:#000;overflow:hidden;transition:transform 0.7s cubic-bezier(0.4,0,0.2,1);">
      <div style="position:absolute;left:0;right:0;top:0;height:56%;background:url('/splash-photo-2.jpg') center top/cover no-repeat;-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 42%,rgba(0,0,0,0.82) 54%,rgba(0,0,0,0.55) 66%,rgba(0,0,0,0.28) 78%,rgba(0,0,0,0.09) 90%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,#000 42%,rgba(0,0,0,0.82) 54%,rgba(0,0,0,0.55) 66%,rgba(0,0,0,0.28) 78%,rgba(0,0,0,0.09) 90%,transparent 100%);"></div>
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0) 12%);"></div>
      <img src="/splash-logo.png" alt="VIBE" style="position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20%);transform:translateX(-50%);width:220px;height:auto;" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
