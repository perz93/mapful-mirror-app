<!doctype html>
<html lang="en" class="splashing">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5eb" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>VIBE — Découvre les events à Abidjan</title>
    <meta name="description" content="Concerts, festivals, expos, brunch... Trouve ce qui se passe autour de toi ce soir à Abidjan." />
    <meta name="author" content="Lovable" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/splash-logo.png" as="image" />

    
    <meta property="og:title" content="VIBE — Découvre les events à Abidjan" />
    <meta property="og:description" content="Concerts, festivals, expos, brunch... Trouve ce qui se passe autour de toi ce soir à Abidjan." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%SITE_ORIGIN%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VIBE — Tous les events d'Abidjan sur une carte" />
    <meta property="og:locale" content="fr_CI" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VIBE — Découvre les events à Abidjan" />
    <meta name="twitter:description" content="Concerts, festivals, expos, brunch... Trouve ce qui se passe autour de toi ce soir." />
    <meta name="twitter:image" content="%SITE_ORIGIN%/og-image.jpg" />
    <style>
      /* Pendant le splash, fond noir partout (sinon iOS teinte la barre d'état en clair) */
      html.splashing,html.splashing body{background:#000!important}
      /* VIBE se tient en portrait : en paysage sur téléphone, message plein écran */
      #rotate-hint{display:none}
      @media (orientation:landscape) and (max-height:500px) and (pointer:coarse){
        #rotate-hint{display:flex;position:fixed;inset:0;z-index:100000;background:#000;color:#f5f5eb;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:600 15px/1.4 -apple-system,system-ui,sans-serif;text-align:center}
        #rotate-hint img{width:150px;height:auto}
      }
      /* Splash : logo découpé (pin, v, i, b, e, point) et animé pièce par pièce */
      .sp-logo{position:absolute;left:50%;top:50%;width:240px;height:120px;transform:translate(-50%,-55%)}
      .sp{position:absolute;inset:0;width:100%;height:100%;opacity:0;will-change:transform,opacity}
      .sp-pin{animation:sp-drop .7s cubic-bezier(.33,0,.67,1) .15s forwards}
      .sp-v,.sp-i,.sp-b,.sp-e{animation:sp-up .55s cubic-bezier(.2,.9,.3,1.25) forwards}
      .sp-v{animation-delay:.7s}.sp-i{animation-delay:.78s}.sp-b{animation-delay:.86s}.sp-e{animation-delay:.94s}
      .sp-dot{transform-origin:76% 71%;animation:sp-pop .5s cubic-bezier(.2,.9,.3,1.4) 1.2s forwards}
      @keyframes sp-drop{0%{opacity:1;transform:translateY(-55vh)}55%{transform:translateY(0)}70%{transform:translateY(-14%)}85%{transform:translateY(0)}93%{transform:translateY(-4%)}100%{opacity:1;transform:translateY(0)}}
      @keyframes sp-up{0%{opacity:0;transform:translateY(30%)}100%{opacity:1;transform:none}}
      @keyframes sp-pop{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.5)}100%{opacity:1;transform:scale(1)}}
      @media (prefers-reduced-motion:reduce){.sp{animation:none!important;opacity:1!important}}
    </style>
  </head>

  <body>
    <!-- Splash animé : le pin tombe sur le « i », puis les lettres montent une à une -->
    <div id="instant-splash" style="position:fixed;inset:0;z-index:9999;background:#000;overflow:hidden;transition:transform 0.7s cubic-bezier(0.4,0,0.2,1);">
      <div class="sp-logo" role="img" aria-label="VIBE">
        <img src="/splash-logo.png" alt="" class="sp sp-v" style="clip-path:inset(0 62.67% 0 21.67%);-webkit-clip-path:inset(0 62.67% 0 21.67%)" />
        <img src="/splash-logo.png" alt="" class="sp sp-i" style="clip-path:inset(41.67% 57.33% 0 37.33%);-webkit-clip-path:inset(41.67% 57.33% 0 37.33%)" />
        <img src="/splash-logo.png" alt="" class="sp sp-b" style="clip-path:inset(0 41.83% 0 42.67%);-webkit-clip-path:inset(0 41.83% 0 42.67%)" />
        <img src="/splash-logo.png" alt="" class="sp sp-e" style="clip-path:inset(0 27.17% 0 58.17%);-webkit-clip-path:inset(0 27.17% 0 58.17%)" />
        <img src="/splash-logo.png" alt="" class="sp sp-pin" style="clip-path:inset(20% 57% 58.33% 35.67%);-webkit-clip-path:inset(20% 57% 58.33% 35.67%)" />
        <img src="/splash-logo.png" alt="" class="sp sp-dot" style="clip-path:inset(0 21.67% 0 72.83%);-webkit-clip-path:inset(0 21.67% 0 72.83%)" />
      </div>
    </div>
    <!-- Téléphone tourné en paysage : on demande de revenir en portrait -->
    <div id="rotate-hint" aria-hidden="true"><img src="/splash-logo.png" alt="" /><p>Tourne ton téléphone<br />pour utiliser VIBE</p></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
