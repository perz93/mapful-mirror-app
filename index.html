    <style>
      /* Pendant le splash, fond noir partout (sinon iOS teinte la barre d'état en clair) */
      html.splashing,html.splashing body,html.modal-open,html.modal-open body{background:#000!important}
      /* Upvibe se tient en portrait : en paysage sur téléphone, message plein écran */
      #rotate-hint{display:none}
      @media (orientation:landscape) and (max-height:500px) and (pointer:coarse){
        #rotate-hint{display:flex;position:fixed;inset:0;z-index:100000;background:#000;color:#f5f5eb;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:600 15px/1.4 -apple-system,system-ui,sans-serif;text-align:center}
        #rotate-hint img{width:150px;height:auto}
      }
      /* Splash : logo découpé (pin, u, p, v, i, b, e, point) et animé pièce par pièce */
      .sp-logo{position:absolute;left:50%;top:50%;width:240px;height:120px;transform:translate(-50%,-55%)}
      .sp{position:absolute;inset:0;width:100%;height:100%;opacity:0;will-change:transform,opacity}
      .sp-pin{animation:sp-drop .7s cubic-bezier(.33,0,.67,1) .15s forwards}
      .sp-u,.sp-p,.sp-v,.sp-i,.sp-b,.sp-e{animation:sp-up .55s cubic-bezier(.2,.9,.3,1.25) forwards}
      .sp-u{animation-delay:.7s}.sp-p{animation-delay:.76s}.sp-v{animation-delay:.82s}.sp-i{animation-delay:.88s}.sp-b{animation-delay:.94s}.sp-e{animation-delay:1s}
      .sp-dot{transform-origin:86.42% 65.67%;animation:sp-pop .5s cubic-bezier(.2,.9,.3,1.4) 1.26s forwards}
      @keyframes sp-drop{0%{opacity:1;transform:translateY(-55vh)}55%{transform:translateY(0)}70%{transform:translateY(-14%)}85%{transform:translateY(0)}93%{transform:translateY(-4%)}100%{opacity:1;transform:translateY(0)}}
      @keyframes sp-up{0%{opacity:0;transform:translateY(30%)}100%{opacity:1;transform:none}}
      @keyframes sp-pop{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.5)}100%{opacity:1;transform:scale(1)}}
      @media (prefers-reduced-motion:reduce){.sp{animation:none!important;opacity:1!important}}
    </style>
  </head>

  <body>
    <!-- Splash animé : le pin tombe sur le « i », puis les lettres montent une à une -->
    <div id="instant-splash" style="position:fixed;inset:0;z-index:9999;background:#000;overflow:hidden;transition:transform 0.7s cubic-bezier(0.4,0,0.2,1);">
      <div class="sp-logo" role="img" aria-label="Upvibe">
        <img src="/splash-logo.png" alt="" class="sp sp-u" style="clip-path:inset(0 75.53% 0 0);-webkit-clip-path:inset(0 75.53% 0 0)" />
        <img src="/splash-logo.png" alt="" class="sp sp-p" style="clip-path:inset(0 61.37% 0 24.47%);-webkit-clip-path:inset(0 61.37% 0 24.47%)" />
        <img src="/splash-logo.png" alt="" class="sp sp-v" style="clip-path:inset(0 48.67% 0 38.63%);-webkit-clip-path:inset(0 48.67% 0 38.63%)" />
        <img src="/splash-logo.png" alt="" class="sp sp-i" style="clip-path:inset(37.85% 42.96% 0 51.33%);-webkit-clip-path:inset(37.85% 42.96% 0 51.33%)" />
        <img src="/splash-logo.png" alt="" class="sp sp-b" style="clip-path:inset(0 28.81% 0 57.04%);-webkit-clip-path:inset(0 28.81% 0 57.04%)" />
        <img src="/splash-logo.png" alt="" class="sp sp-e" style="clip-path:inset(0 16.05% 0 71.19%);-webkit-clip-path:inset(0 16.05% 0 71.19%)" />
        <img src="/splash-logo.png" alt="" class="sp sp-pin" style="clip-path:inset(23.2% 42.69% 62.15% 51.05%);-webkit-clip-path:inset(23.2% 42.69% 62.15% 51.05%)" />
        <img src="/splash-logo.png" alt="" class="sp sp-dot" style="clip-path:inset(0 0 0 84.77%);-webkit-clip-path:inset(0 0 0 84.77%)" />
      </div>
    </div>
    <!-- Téléphone tourné en paysage : on demande de revenir en portrait -->
    <div id="rotate-hint" aria-hidden="true"><img src="/splash-logo.png" alt="" /><p>Tourne ton téléphone<br />pour utiliser Upvibe</p></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
