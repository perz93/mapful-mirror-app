<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<title>VIBE</title>
</head>
<body style="margin:0;padding:0;background:#f5f5eb;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Ton lien de connexion.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f5f5eb" style="background:#f5f5eb;">
  <tr>
    <td align="center" style="padding:28px 14px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:460px;">
        <tr>
          <td bgcolor="#a6e22e" style="background:#a6e22e;border-radius:28px;overflow:hidden;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <!-- Logo + badge -->
              <tr>
                <td style="padding:28px 26px 0;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
                    <td style="font-family:Arial,Helvetica,sans-serif;font-size:30px;line-height:1;font-weight:800;letter-spacing:-1.5px;color:#14140f;">vibe<span style="color:#ffffff;">.</span></td>
                    <td align="right"><span style="display:inline-block;background:#14140f;color:#a6e22e;border-radius:999px;padding:6px 12px;font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:800;letter-spacing:1px;">CONNEXION</span></td>
                  </tr></table>
                </td>
              </tr>
              <!-- Titre -->
              <tr>
                <td style="padding:30px 26px 0;font-family:Arial,Helvetica,sans-serif;font-size:52px;line-height:0.95;font-weight:900;letter-spacing:-2.5px;color:#14140f;">C'est toi<span style="color:#ffffff;">.</span></td>
              </tr>
              <!-- Texte -->
              <tr>
                <td style="padding:16px 26px 0;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.45;color:#14140f;">Un tap pour te connecter, sans mot de passe.</td>
              </tr>
              <!-- Bouton -->
              <tr>
                <td style="padding:22px 26px 0;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
                    <td align="center" bgcolor="#14140f" style="background:#14140f;border-radius:999px;">
                      <a href="{{ .ConfirmationURL }}" target="_blank" style="display:block;padding:17px 20px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;color:#a6e22e;text-decoration:none;border-radius:999px;">Me connecter&nbsp;&rarr;</a>
                    </td>
                  </tr></table>
                </td>
              </tr>
              <!-- Petit texte -->
              <tr>
                <td style="padding:16px 26px 28px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#3d4d12;">Lien valable 1 h, utilisable une fois.</td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- Lien de secours + pied de page -->
        <tr>
          <td align="center" style="padding:20px 10px 0;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.6;color:#8a897e;">
            Le bouton ne marche pas ? <a href="{{ .ConfirmationURL }}" style="color:#14140f;">Ouvre ce lien</a>.<br>
            VIBE · Les événements d'Abidjan sur une carte
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
